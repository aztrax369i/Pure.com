<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <!-- <link rel="stylesheet" href="../css/product.css" /> -->

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
    <header id="navbar"></header>
    <div class="container-fluid">
        <section class="Products&Publications">
            <div class="row">
                <div class="col">
                    <p>Inicio / Productos</p>
                    <h5>EL CATÁLOGO PURE</h5>
                    <h1>Profesionales por naturaleza.</h1>
                    <p>
                        Encuentra tu uniforme por corte, prenda y entorno de trabajo. Una selección de líneas precisas y presencia sobria.
                    </p>
                </div>
            </div>
        </section>
        <section class="CollectionTabs">
            <div class="row">
                <div class="col">
                    <button>Todos</button>
                    <button>Corte Masculino</button>
                    <button>Corte Femenil</button>
                    <button>Unisex</button>
                </div>
            </div>
        </section>
        <section class="CatalogoLayout">
            <div class="row">
                <div class="col-2">
                    <div class="d-flex">
                        <h5>Filtros</h5>
                        <button>F</button>
                    </div>

                    <div class="Categoría">
                        <input type="checkbox" name="" id="checkbox" />
                        <label for="">Todos los cortes</label>
                        <input type="checkbox" name="" />
                        <label for="">Corte masculino</label>
                        <input type="checkbox" name="" />
                        <label for="">Corte femenil</label>
                        <input type="checkbox" name="" />
                        <label for="">Corte unisex</label>
                    </div>

                    <div class="prenda">
                        <h5>Prenda</h5>
                        <input type="checkbox" name="" id="checkbox" />
                        <label for="">Todos las prendas</label>
                        <input type="checkbox" name="" />
                        <label for="">Filipinas</label>
                        <input type="checkbox" name="" />
                        <label for="">Pantalones</label>
                        <input type="checkbox" name="" />
                        <label for="">Saco</label>
                        <input type="checkbox" name="" id="checkbox" />
                        <label for="">Chamarra</label>
                        <input type="checkbox" name="" />
                        <label for="">Cubre polvos</label>
                        <input type="checkbox" name="" />
                        <label for="">Chaleco</label>
                        <input type="checkbox" name="" />
                        <label for="">Uniformes estandarizados</label>
                    </div>

                    <div class="color">
                        <h5>Color</h5>
                        <input type="checkbox" name="" id="" />
                        <label for="">Todos los colores</label>
                        <input type="checkbox" name="" id="" />
                        <label for="">Blanco</label>
                        <input type="checkbox" name="" id="" />
                        <label for="">Negro</label>
                        <input type="checkbox" name="" id="" />
                        <label for="">Azul Petróleo</label>
                    </div>

                    <div class="material">
                        <h5>Material</h5>
                        <input type="checkbox" name="" id="" />
                        <label for="">Todos los materiales</label>
                        <input type="checkbox" name="" id="" />
                        <label for="">Poliéster / Algodón</label>
                        <input type="checkbox" name="" id="" />
                        <label for="">Microfibra</label>
                        <input type="checkbox" name="" id="" />
                        <label for="">Neopreno</label>
                    </div>
                    <button type="reset">Restablecer Filtros</button>
                </div>
                <div class="col-10">
                    <div class="results">
                        <label for="">12 productos</label>
                        <select name="" id="">
                <option value="">Item</option>
                <option value="">Corte</option>
                <option value="">Precio</option>
              </select>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer id="footer"></footer>

    <!-- Javascript -->
    <script type="module" src="../js/main.js"></script>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js " integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI " crossorigin="anonymous "></script>
</body>

</html>
